name: ALAI Hybrid Autonomous Learning

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes to learn in this run"
        required: false
        default: "15"
      max_cycles:
        description: "Max governed cycles inside this run"
        required: false
        default: "1"

  schedule:
    # Panama UTC-5.
    # 6:00 AM - 9:00 PM Panama.
    # GitHub starts a new run every 20 minutes.
    # Each run learns for ~15 minutes, sleeps 2 minutes, then exits.
    - cron: "0,20,40 11-23 * * *"
    - cron: "0,20,40 0-2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: alai-hybrid-autonomous-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ALAI_SESSION_MINUTES: ${{ github.event.inputs.session_minutes || '15' }}
      ALAI_SLEEP_SECONDS: "120"
      ALAI_MAX_CYCLES: ${{ github.event.inputs.max_cycles || '1' }}

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
      GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_TEST: ${{ secrets.GEMINI_API_KEY_TEST }}
      GEMINI_PREMIUM_KEY: ${{ secrets.GEMINI_PREMIUM_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_DISABLED: ${{ secrets.GEMINI_DISABLED }}

      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}

      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HF_API_KEY_2: ${{ secrets.HF_API_KEY_2 }}
      HF_API_KEY_3: ${{ secrets.HF_API_KEY_3 }}
      HF_API_KEY_4: ${{ secrets.HF_API_KEY_4 }}
      HF_API_KEY_5: ${{ secrets.HF_API_KEY_5 }}
      HF_API_KEY_TEST: ${{ secrets.HF_API_KEY_TEST }}
      HF_MODEL: ${{ secrets.HF_MODEL }}
      HF_DISABLED: ${{ secrets.HF_DISABLED }}

      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      SAMBANOVA_API_KEY_2: ${{ secrets.SAMBANOVA_API_KEY_2 }}
      SAMBANOVA_API_KEY_3: ${{ secrets.SAMBANOVA_API_KEY_3 }}
      SAMBANOVA_API_KEY_4: ${{ secrets.SAMBANOVA_API_KEY_4 }}
      SAMBANOVA_API_KEY_5: ${{ secrets.SAMBANOVA_API_KEY_5 }}
      SAMBANOVA_API_KEY_TEST: ${{ secrets.SAMBANOVA_API_KEY_TEST }}
      SAMBANOVA_MODEL: ${{ secrets.SAMBANOVA_MODEL }}
      SAMBANOVA_DISABLED: ${{ secrets.SAMBANOVA_DISABLED }}

      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}

      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DAILY_BACKUP: ${{ secrets.CLOUDFLARE_DAILY_BACKUP }}
      CLOUDFLARE_MODEL: ${{ secrets.CLOUDFLARE_MODEL }}

      GITHUB_MODELS_API_KEY: ${{ secrets.JIT }}
      GITHUB_MODELS_API_KEY_2: ${{ secrets.JIT2 }}
      GITHUB_MODELS_API_KEY_3: ${{ secrets.JIT3 }}
      GITHUB_MODELS_API_KEY_4: ${{ secrets.JIT4 }}
      GITHUB_MODELS_API_KEY_5: ${{ secrets.JIT5 }}
      GITHUB_MODELS_API_KEY_6: ${{ secrets.JIT6 }}
      GITHUB_MODELS_MODEL: ${{ secrets.JIT_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore ALAI seed database
        run: |
          if [ -f data/alai.seed.db.gz ]; then
            gunzip -c data/alai.seed.db.gz > data/alai.db
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run governed ALAI hybrid learning loop
        run: npm run alai:github-day-loop

      - name: Verify ALAI health before commit
        run: |
          npm run alai:objective-3-final-audit
          npm run alai:real-rating
          npm run model:health

      - name: Commit learned ALAI state
        run: |
          git config user.name "ALAI Hybrid Learner"
          git config user.email "alai-bot@users.noreply.github.com"

          git add data/alai.db package.json package-lock.json scripts src .github/workflows || true

          if git diff --cached --quiet; then
            echo "No ALAI learning changes to commit."
          else
            git commit -m "ALAI hybrid autonomous learning update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Trigger next daytime ALAI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PANAMA_HOUR=$(TZ=America/Panama date +%H)
          PANAMA_MINUTE=$(TZ=America/Panama date +%M)

          echo "Panama time: ${PANAMA_HOUR}:${PANAMA_MINUTE}"

          if [ "$PANAMA_HOUR" -ge 6 ] && [ "$PANAMA_HOUR" -lt 21 ]; then
            echo "Inside daytime window. Triggering next ALAI run."
            gh workflow run alai-autonomous-learning.yml               --ref "${GITHUB_REF_NAME}"               -f session_minutes=15               -f max_cycles=1
          else
            echo "Outside daytime window. Not triggering next run."
          fi
